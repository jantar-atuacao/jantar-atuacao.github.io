*{box-sizing:border-box}

mark{background:var(--lima);color:var(--escuro);border-radius:3px;padding:0 1px}

const norm = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
DADOS.forEach(d => d.k = norm(d.n + " " + d.c + " " + d.a));
const $q = document.getElementById("q"), $l = document.getElementById("lista"), $i = document.getElementById("info");

function realca(texto, termos) {
  // devolve um fragmento com os trechos buscados marcados (sem innerHTML)
  const frag = document.createDocumentFragment(), n = norm(texto);
  const marcas = new Array(texto.length).fill(false);
  termos.forEach(t => { let p = n.indexOf(t); while (t && p >= 0) { for (let j = p; j < p + t.length; j++) marcas[j] = true; p = n.indexOf(t, p + 1); } });
  let i = 0;
  while (i < texto.length) {
    let j = i; while (j < texto.length && marcas[j] === marcas[i]) j++;
    const pedaco = texto.slice(i, j);
    if (marcas[i]) { const m = document.createElement("mark"); m.textContent = pedaco; frag.append(m); } else frag.append(pedaco);
    i = j;
  }
  return frag;
}

function el(tag, cls, filho) { const e = document.createElement(tag); if (cls) e.className = cls; if (filho) e.append(filho); return e; }

function render() {
  const termos = norm($q.value).trim().split(/\s+/).filter(Boolean);
  $l.replaceChildren();
  if (!termos.length) { $i.textContent = `${DADOS.length} convidados cadastrados. Comece a digitar.`; return; }
  const achados = DADOS.filter(d => termos.every(t => d.k.includes(t))).sort((a, b) => a.m - b.m || a.n.localeCompare(b.n));
  $i.textContent = achados.length ? `${achados.length} resultado${achados.length > 1 ? "s" : ""}` : "Nenhum resultado. Tente só o primeiro nome ou parte do condomínio. Se não encontrar, procure a recepção.";

    const mesa = el("div", "mesa"); mesa.append(el("small", "", "Mesa"), el("b", "", String(d.m)));
    const txt = el("div"); txt.append(el("div", "nome", realca(d.n, termos)), el("div", "cond", realca(d.c, termos)));
    if (d.a) txt.append(el("div", "acomp", realca(d.a, termos)));
    const card = el("div", "card"); card.append(mesa, txt); $l.append(card);
  });
}
