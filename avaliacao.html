<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#00363B">
<title>Jantar do Síndico 2026 · Avalie o evento</title>
<link rel="icon" href="logo.png">
<meta property="og:type" content="website">
<meta property="og:title" content="Jantar do Síndico 2026 · Avalie o evento">
<meta property="og:description" content="Nos ajude a melhorar nosso evento. Avaliação rápida e anônima.">
<meta property="og:url" content="https://jantar-atuacao.github.io/avaliacao.html">
<meta property="og:image" content="https://jantar-atuacao.github.io/og-avaliacao.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<style>
:root{--teal:#009590;--escuro:#00363B;--lima:#BCCD00;--fundo:#F4F7F6;--suave:#5b7476;--borda:#dbe5e4}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--fundo);color:var(--escuro);-webkit-text-size-adjust:100%}
header{background:var(--escuro);color:#fff;padding:20px 16px 56px;text-align:center}
header img{width:120px;height:auto;background:#fff;border-radius:14px;padding:8px}
h1{margin:12px 0 4px;font-size:1.5rem}
header p{margin:0;opacity:.85}
main{max-width:560px;margin:-36px auto 32px;padding:0 16px}
fieldset{background:#fff;border:1px solid var(--borda);border-radius:14px;padding:14px 16px;margin:0 0 12px}
legend{font-weight:700;font-size:1.1rem;padding:0;float:left;width:100%;margin-bottom:8px}
.estrelas{clear:both;display:flex;flex-direction:row-reverse;justify-content:flex-end;gap:4px}
.estrelas input{position:absolute;opacity:0;width:1px;height:1px}
.estrelas label{font-size:2.4rem;line-height:1;color:var(--borda);cursor:pointer;padding:0 2px}
.estrelas input:checked~label,.estrelas label:hover,.estrelas label:hover~label{color:var(--lima)}
.estrelas input:focus-visible+label{outline:2px solid var(--teal);border-radius:6px}
textarea{width:100%;min-height:96px;font:inherit;font-size:1rem;padding:12px;border:1px solid var(--borda);border-radius:10px;clear:both;display:block}
button{width:100%;font-size:1.15rem;font-weight:700;padding:16px;border:0;border-radius:14px;background:var(--teal);color:#fff;cursor:pointer}
button:disabled{opacity:.6}
#msg{text-align:center;margin:14px 4px;color:var(--suave)}
.obrigado{background:#fff;border:1px solid var(--borda);border-radius:14px;padding:28px 16px;text-align:center;font-size:1.15rem}
footer{text-align:center;color:var(--suave);font-size:.8rem;padding:0 16px 24px}
</style>
</head>
<body>
<header>
  <img src="logo.png" alt="Atuação Garantidora">
  <h1>Como foi o Jantar do Síndico?</h1>
  <p>Leva menos de 1 minuto. A avaliação é anônima.</p>
</header>
<main>
  <form id="f" novalidate></form>
  <p id="msg" aria-live="polite"></p>
</main>
<footer>Atuação Garantidora · Obrigado pela presença!</footer>
<script>
const API = "https://script.google.com/macros/s/AKfycbyqKtE-D0-i1NMxL-72Lkr9UYwv--8B7WxjI5o7zw4bYFFZ_-MpBv_yIBDXe7K0CiAH/exec";
const ITENS = [["organizacao", "Organização"], ["alimentacao", "Alimentação"], ["atracoes", "Atrações"], ["brindes", "Brindes"]];
const $f = document.getElementById("f"), $m = document.getElementById("msg");

ITENS.forEach(([k, rotulo]) => {
  const fs = document.createElement("fieldset"), lg = document.createElement("legend"), box = document.createElement("div");
  lg.textContent = rotulo; box.className = "estrelas";
  for (let n = 5; n >= 1; n--) { // ordem invertida: o CSS pinta as estrelas à esquerda da escolhida
    const id = `${k}${n}`, inp = document.createElement("input"), lb = document.createElement("label");
    Object.assign(inp, { type: "radio", name: k, value: n, id });
    lb.htmlFor = id; lb.textContent = "★"; lb.title = `${n} de 5`; lb.setAttribute("aria-label", `${rotulo}: ${n} de 5`);
    box.append(inp, lb);
  }
  fs.append(lg, box); $f.append(fs);
});
const fsC = document.createElement("fieldset"), lgC = document.createElement("legend"), ta = document.createElement("textarea");
lgC.textContent = "Quer deixar um comentário? (opcional)"; ta.name = "comentario"; ta.maxLength = 1000;
fsC.append(lgC, ta);
const bt = document.createElement("button"); bt.type = "submit"; bt.textContent = "Enviar avaliação";
$f.append(fsC, bt);

$f.addEventListener("submit", async ev => {
  ev.preventDefault();
  const d = Object.fromEntries(new FormData($f));
  const falta = ITENS.filter(([k]) => !d[k]).map(([, r]) => r);
  if (falta.length) { $m.textContent = `Falta dar nota para: ${falta.join(", ")}.`; return; }
  bt.disabled = true; $m.textContent = "Enviando...";
  try {
    // text/plain evita o preflight CORS que o Apps Script não responde
    const r = await fetch(API, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(d) });
    const j = await r.json();
    if (!j.ok) throw new Error(j.erro);
    const ok = document.createElement("div"); ok.className = "obrigado"; ok.textContent = "Avaliação enviada. Muito obrigado!";
    $f.replaceWith(ok); $m.textContent = "";
  } catch (e) {
    bt.disabled = false; $m.textContent = "Não foi possível enviar agora. Verifique a internet e tente de novo.";
  }
});
</script>
</body>
</html>
